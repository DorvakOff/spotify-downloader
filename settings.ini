# ============================================================
#  Configuration du Spotify Downloader
#  Edite ce fichier avec le Bloc-notes puis relance download.bat
# ============================================================

[sortie]
# Dossier de base ou atterrissent les musiques.
# Un sous-dossier est cree automatiquement par playlist ({list-name}).
#
# Exemples :
#   base = E:\Workspace\spotify-downloader\Musique
#   base = U:\MUSIC                 <- une cle USB montee en U:
#   base = D:\DJ\Tracks
#
# ATTENTION : pas de guillemets, pas de slash final.
base = D:\DJ\Tracks

[qualite]
# Format audio : mp3, opus, m4a, flac, wav
format = mp3

# Debit (mp3 uniquement). 320k = qualite max, compatibilite DJ maximale.
bitrate = 320k

# Sources audio essayees DANS L'ORDRE (fallback).
# Si un titre est introuvable sur la 1re, spotdl essaie la suivante.
# Valeurs possibles : youtube-music, youtube, soundcloud, bandcamp, piped
# Pour hardstyle/frenchcore/rawstyle, soundcloud trouve beaucoup plus,
# donc on le met en PREMIER. Inverse l'ordre pour une playlist pop
# (youtube-music donne alors des versions officielles plus propres).
providers = soundcloud youtube-music bandcamp

# Normalisation du volume (loudness EBU R128 a -14 LUFS) via ffmpeg (oui/non).
# Tres utile pour un set DJ : harmonise le volume entre SoundCloud/YouTube.
# oui (defaut) = reecrit chaque fichier telecharge (un peu plus long).
# non          = laisse le volume d'origine.
normaliser = oui

[avance]
# Modele de nommage des fichiers. {list-name} = nom de la playlist.
# {artists} = artiste(s), {title} = titre.
template = {list-name}\{artists} - {title}.{output-ext}

# Nombre de telechargements simultanes (parallelisation).
# Plus haut = plus rapide, mais plus de risque de rate-limit YouTube.
# 8 est un bon compromis ; baisse a 4 si tu as des erreurs reseau.
threads = 8

# Ignorer les titres deja telecharges (oui/non).
# oui  = ne re-telecharge pas un fichier deja present (reprise rapide).
# non  = retelecharge / ecrase.
skip_existants = oui

# Scan complet du dossier a chaque lancement (oui/non).
# non (defaut) = plus RAPIDE ; spotdl saute les doublons par nom de fichier.
# oui          = re-scanne TOUTE la bibliotheque pour detecter les existants
#                deplaces/renommes (plus lent sur un gros dossier).
scan_complet = non

# Mode synchronisation par defaut (oui/non).
# oui = utilise `spotdl sync` : a chaque run, ajoute les nouveaux titres de la
#       playlist et retire ceux qui en ont ete enleves (suivi de playlist).
# non = `spotdl download` classique (ajoute seulement, ne retire rien).
# Peut aussi s'activer ponctuellement : downloader.py --sync "<url>"
sync = non
